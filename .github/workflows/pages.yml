name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject Apps Script auth URL from repository secret
        env:
          AUTH_URL: ${{ secrets.PORTAL_APPS_SCRIPT_URL }}
        run: |
          if [ -n "$AUTH_URL" ]; then
            cat > static/js/portal-config.js <<EOF
          /**
           * URL входа (Google Apps Script). Задаётся секретом PORTAL_APPS_SCRIPT_URL в GitHub.
           */
          window.PORTAL_API_URL = "$AUTH_URL";
          EOF
          else
            cat > static/js/portal-config.js <<'EOF'
          /** Пусто = демо-вход из data/portal.json (до подключения Google Таблицы). */
          window.PORTAL_API_URL = "";
          EOF
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            static
            data
            .nojekyll
      - id: deployment
        uses: actions/deploy-pages@v4
